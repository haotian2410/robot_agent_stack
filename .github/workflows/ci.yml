name: robot-agent-stack

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install headless Mesa dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libglu1-mesa
      - name: Install all packages from a clean environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/robot_agent_protocol
          python -m pip install -e packages/robot_agent_control
          python -m pip install -e 'packages/robot_agent_sim[dev]'
      - name: Run protocol, package, integration and e2e tests
        run: |
          pytest -q packages/robot_agent_protocol/tests packages/robot_agent_control/tests packages/robot_agent_sim/tests tests/integration tests/e2e
      - name: Verify installed CLIs outside the checkout
        working-directory: /tmp
        run: |
          robot-agent --help
          robot-agent-control --help
      - name: Run legacy control fixture headless
        run: |
          python -m robot_agent_control.cli \
            --commands packages/robot_agent_control/demo/skill_command/config_001.commands.json \
            --viewer-mode headless >/dev/null

  wheel-install:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling and headless dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libglu1-mesa
          python -m pip install --upgrade pip build
      - name: Build wheels
        run: |
          python -m build packages/robot_agent_protocol
          python -m build packages/robot_agent_control
          python -m build packages/robot_agent_sim
      - name: Install wheels into clean venv and test package resources
        run: |
          python -m venv /tmp/robot-agent-wheel-test
          /tmp/robot-agent-wheel-test/bin/pip install packages/robot_agent_protocol/dist/*.whl packages/robot_agent_control/dist/*.whl packages/robot_agent_sim/dist/*.whl
          cd /tmp
          /tmp/robot-agent-wheel-test/bin/python -c 'from robot_agent_control.robot_profile import RobotProfile; assert RobotProfile.load_for_robot("ur5e").name == "ur5e"'
          /tmp/robot-agent-wheel-test/bin/robot-agent --help
          /tmp/robot-agent-wheel-test/bin/robot-agent-control --help
