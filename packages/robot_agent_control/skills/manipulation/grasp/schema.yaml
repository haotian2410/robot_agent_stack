name: Grasp
version: "2.0"

description: >-
  Execute gripper opening, closing, contact detection, force application,
  holding and grasp verification after the robot has reached a grasp pose.

input:
  target:
    type: object
    required: true
    description: Object or grasp-pose reference associated with the grasp action.
    properties:
      type:
        type: string
        required: true
        enum: [object, grasp_pose]
      object_id: {type: string}
      category: {type: string}
      expected_width: {type: float, unit: meter, range: [0.0, 10.0]}
      expected_weight: {type: float, unit: kilogram, range: [0.0, 10000.0]}
      grasp_pose: {type: object}

  grasp:
    type: object
    default: {}
    description: Task-level grasp execution intent used by the deterministic selector.
    properties:
      strategy:
        type: string
        default: auto
        enum: [auto, default_grasp]
      operation:
        type: string
        default: grasp
        enum: [grasp, regrasp, verify_only]
      gripper_id: {type: string, default: default_gripper}
      verification_mode:
        type: string
        default: auto
        enum: [auto, position, force, tactile, visual, combined]

  constraints:
    type: object
    default: {}
    properties:
      verify_grasp: {type: boolean, default: true}
      retry_count: {type: integer, range: [0, 10], default: 0}
      hold_on_success: {type: boolean, default: true}
      timeout: {type: float, unit: second, range: [0.1, 600.0], default: 10.0}
      maximum_force: {type: float, unit: newton, range: [0.0, 10000.0], default: 40.0}
      maximum_width: {type: float, unit: meter, range: [0.0, 10.0]}
      minimum_width: {type: float, unit: meter, range: [0.0, 10.0], default: 0.0}
      contact_required: {type: boolean, default: true}
      slip_check: {type: boolean, default: true}
      require_pose_alignment: {type: boolean, default: false}
      pose_position_tolerance: {type: float, unit: meter, range: [0.0, 1.0], default: 0.01}
      pose_orientation_tolerance: {type: float, unit: degree, range: [0.0, 180.0], default: 10.0}

  strategy_params:
    type: object
    default: {}
    description: >-
      Parameters owned by the selected Grasp Strategy. The selected strategy
      schema performs final strategy-specific validation.

  runtime_context:
    type: object
    internal: true
    description: Populated by the robot runtime rather than generated by the Agent.
    properties:
      current_gripper_state: {type: object}
      current_end_effector_pose: {type: object}
      gripper_model: {type: object}
      gripper_limits: {type: object}
      gripper_controller_state: {type: object}
      finger_state: {type: object}
      force_torque_state: {type: object}
      tactile_state: {type: object}
      object_presence_state: {type: object}
      slip_state: {type: object}
      tool_state: {type: object}
      payload_state: {type: object}
      safety_state: {type: object}

  validation_rules:
    - when: target.type == object
      require_any: [target.object_id, target.category]
    - when: target.type == grasp_pose
      require: [target.grasp_pose]
    - when: grasp.verification_mode == force
      require_runtime: [force_torque_state]
    - when: grasp.verification_mode == tactile
      require_runtime: [tactile_state]
    - when: constraints.require_pose_alignment == true
      require_any: [target.grasp_pose]

output:
  success: {type: boolean}
  status:
    type: string
    enum: [completed, failed, timeout]

  selection:
    type: object
    nullable: true
    properties:
      grasp_strategy:
        type: string
        enum: [default_grasp]
      selection_reason: {type: string}
      retry_used: {type: boolean}

  grasp_result:
    type: object
    nullable: true
    properties:
      grasped: {type: boolean}
      contact_detected: {type: boolean}
      final_width: {type: float, unit: meter}
      final_force: {type: float, unit: newton}
      holding: {type: boolean}
      verified: {type: boolean}
      verification_method: {type: string}
      slip_detected: {type: boolean}
      attempts: {type: integer}
      evidence: {type: object}
      execution_time: {type: float, unit: second}

  error:
    type: object
    nullable: true
    properties:
      error_code: {type: string}
      error_message: {type: string}
      failed_stage: {type: string}
      recoverable: {type: boolean}
      recommended_action: {type: string}
