name: LinearMove
version: "2.0"

description: Parameters specific to the Linear Move Path Strategy.

input:
  cartesian_step:
    type: float
    unit: meter
    range: [0.0001, 0.1]
    default: 0.01

  orientation_mode:
    type: string
    default: fixed
    enum: [fixed, interpolate, target_only]

  direction:
    type: object
    description: Optional direction for relative Cartesian motion.
    properties:
      frame: {type: string, default: tool}
      x: {type: float}
      y: {type: float}
      z: {type: float}

  distance:
    type: float
    unit: meter
    description: Required when direction is provided.

  jump_threshold:
    type: float
    default: 0.0
    description: Backend-specific joint jump threshold. Zero may disable the check.

  min_path_fraction:
    type: float
    range: [0.0, 1.0]
    default: 0.98

validation_rules:
  - when: direction is provided
    require: [distance]
